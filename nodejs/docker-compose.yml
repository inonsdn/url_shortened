services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: url_shortened
    ports:
      ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d url_shortened"]
      interval: 2s
      timeout: 30s
      retries: 15
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
  api:
    build: .                     # use the Dockerfile in this folder
    init: true                   # forwards Ctrl+C / docker stop to Node properly
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://app:admin@postgres:5432/url_shortened
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  pgdata:
